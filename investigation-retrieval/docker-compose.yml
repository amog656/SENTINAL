version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: investigation-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investigator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investigator}
      POSTGRES_DB: ${POSTGRES_DB:-investigation}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investigator} -d ${POSTGRES_DB:-investigation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: investigation-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data: